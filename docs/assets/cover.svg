    <text x="64" y="171" font-size="78" font-weight="600" fill="#f4f1ea" letter-spacing="-3">牛逼课表</text>
    <text x="69" y="233" font-size="31" fill="#d9d7d1">一眼看清一周。</text>
    <text x="70" y="319" font-size="17" fill="#aeb4c0">LUTschedule</text>
    <path d="M191 306V321" stroke="#5c6370"/>
