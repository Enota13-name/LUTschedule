<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390" role="img" aria-labelledby="title desc">
  <title id="title">牛逼课表</title>
  <desc id="desc">深色背景上的项目名称和标语，一侧以抽象课程块表现一周的安排。</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15171c"/>
      <stop offset="1" stop-color="#252932"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="390" fill="url(#base)"/>
  <path d="M0 389H1280" stroke="#5b6170" stroke-opacity=".5"/>
  <g font-family="Inter,Segoe UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif">
