        <text x="43" y="28">MON</text>
        <text x="117" y="28">TUE</text>
        <text x="191" y="28" fill="#f4f1ea">WED</text>
        <text x="265" y="28">THU</text>
        <text x="339" y="28">FRI</text>
        <text x="413" y="28">SAT</text>
